<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Wheel</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --control-bg: #ffffff;
        --control-border: #666666;
        --muted: #666666;
        --shadow: rgba(0, 0, 0, 0.15);
        --nav-bg: #f5f5f5;
        --nav-border: #dddddd;
      }
      :root[data-theme="dark"] {
        --bg: #121212;
        --text: #eeeeee;
        --control-bg: #1e1e1e;
        --control-border: #888888;
        --muted: #aaaaaa;
        --shadow: rgba(0, 0, 0, 0.6);
        --nav-bg: #1b1b1b;
        --nav-border: #333333;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .top-nav {
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
      }
      .top-nav button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: 4px;
        cursor: pointer;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 4rem 1rem;
        text-align: center;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
      }
      .hero button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: 4px;
        cursor: pointer;
      }
      #back-to-top {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        line-height: 1;
        box-shadow: 0 2px 6px var(--shadow);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #back-to-top.is-visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .wheel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .wheel button {
        font: inherit;
        padding: 0.5rem 1.5rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: 4px;
        cursor: pointer;
      }
      .wheel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #wheel-result {
        margin: 0;
        min-height: 1.5rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav class="top-nav" aria-label="Site">
      <button id="theme-toggle" type="button">Dark</button>
    </nav>
    <main class="hero">
      <h1 id="greeting">Hello world</h1>
      <button id="lang-toggle" type="button">Latviski</button>
      <section class="wheel" aria-label="Spin the wheel">
        <canvas id="wheel-canvas" width="300" height="300" role="img" aria-label="Prize wheel"></canvas>
        <button id="spin-button" type="button">Spin</button>
        <p id="wheel-result" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer style="text-align: center; font-size: 0.85rem; color: var(--muted); padding: 1rem;">
      &copy; 2026 Elgars Logins &middot;
      <a href="https://github.com/elglogins/briefly-wheel-demo" target="_blank" rel="noopener noreferrer">View on GitHub</a>
      <br>
      Made with &#10084; in Aarhus, Denmark
    </footer>
    <button id="back-to-top" type="button" aria-label="Back to top" aria-hidden="true" tabindex="-1">&uarr;</button>
    <script>
      (function () {
        var GREETINGS = { en: "Hello world", lv: "Sveiks!", da: "Hej verden", es: "Hola mundo" };
        var TOGGLE_LABEL = { en: "Latviski", lv: "Dansk", da: "Español", es: "English" };
        var LANG_ORDER = ["en", "lv", "da", "es"];
        var STORAGE_KEY = "wheel.lang";
        var greeting = document.getElementById("greeting");
        var toggle = document.getElementById("lang-toggle");

        function apply(lang) {
          if (!GREETINGS[lang]) lang = "en";
          document.documentElement.lang = lang;
          greeting.textContent = GREETINGS[lang];
          toggle.textContent = TOGGLE_LABEL[lang];
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
        }

        var initial = "en";
        try { initial = localStorage.getItem(STORAGE_KEY) || "en"; } catch (e) {}
        apply(initial);

        toggle.addEventListener("click", function () {
          var current = LANG_ORDER.indexOf(document.documentElement.lang);
          var next = LANG_ORDER[(current + 1) % LANG_ORDER.length];
          apply(next);
        });

        var backToTop = document.getElementById("back-to-top");
        var ticking = false;
        var visible = false;

        function updateVisibility() {
          var shouldShow = window.scrollY > 200;
          if (shouldShow !== visible) {
            visible = shouldShow;
            backToTop.classList.toggle("is-visible", visible);
            if (visible) {
              backToTop.removeAttribute("aria-hidden");
              backToTop.removeAttribute("tabindex");
            } else {
              backToTop.setAttribute("aria-hidden", "true");
              backToTop.setAttribute("tabindex", "-1");
            }
          }
          ticking = false;
        }

        window.addEventListener("scroll", function () {
          if (!ticking) {
            window.requestAnimationFrame(updateVisibility);
            ticking = true;
          }
        });

        backToTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();

      (function () {
        var TOGGLE_LABEL = { light: "Dark", dark: "Light" };
        var STORAGE_KEY = "wheel.theme";
        var toggle = document.getElementById("theme-toggle");

        function apply(theme) {
          if (theme !== "dark") theme = "light";
          document.documentElement.setAttribute("data-theme", theme);
          toggle.textContent = TOGGLE_LABEL[theme];
          try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        }

        var stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
        var initial = stored;
        if (initial !== "light" && initial !== "dark") {
          initial = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        apply(initial);

        toggle.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          apply(current === "dark" ? "light" : "dark");
        });
      })();

      (function () {
        var SEGMENTS = [1, 2, 3, 4, 5, 6];
        var COLORS = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4", "#46c2cb"];
        var EXTRA_SPINS = 5;
        var DURATION = 4000;
        var TWO_PI = Math.PI * 2;
        var POINTER_ANGLE = TWO_PI * 0.75; // top of the wheel (12 o'clock)

        var canvas = document.getElementById("wheel-canvas");
        var spinButton = document.getElementById("spin-button");
        var result = document.getElementById("wheel-result");
        var ctx = canvas.getContext("2d");

        var size = canvas.width;
        var cx = size / 2;
        var cy = size / 2;
        var radius = cx - 4;
        var seg = TWO_PI / SEGMENTS.length;
        var rotation = 0;
        var spinning = false;

        function draw(angle) {
          ctx.clearRect(0, 0, size, size);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          for (var i = 0; i < SEGMENTS.length; i++) {
            var start = i * seg;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, start, start + seg);
            ctx.closePath();
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();
            ctx.save();
            ctx.rotate(start + seg / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(String(SEGMENTS[i]), radius - 14, 0);
            ctx.restore();
          }
          ctx.restore();
          // fixed pointer at the top, pointing down into the wheel
          ctx.beginPath();
          ctx.moveTo(cx - 10, 2);
          ctx.lineTo(cx + 10, 2);
          ctx.lineTo(cx, 22);
          ctx.closePath();
          ctx.fillStyle = "#222";
          ctx.fill();
        }

        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }

        function spin() {
          if (spinning) return;
          spinning = true;
          spinButton.disabled = true;
          result.textContent = "";

          var target = Math.floor(Math.random() * SEGMENTS.length);
          // angle that puts the centre of the target segment under the pointer
          var desired = ((POINTER_ANGLE - (target + 0.5) * seg) % TWO_PI + TWO_PI) % TWO_PI;
          var currentMod = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
          var delta = ((desired - currentMod) % TWO_PI + TWO_PI) % TWO_PI;
          var from = rotation;
          var to = rotation + EXTRA_SPINS * TWO_PI + delta;
          var startTime = null;

          function step(now) {
            if (startTime === null) startTime = now;
            var p = Math.min((now - startTime) / DURATION, 1);
            rotation = from + (to - from) * easeOut(p);
            draw(rotation);
            if (p < 1) {
              window.requestAnimationFrame(step);
            } else {
              rotation = to;
              spinning = false;
              spinButton.disabled = false;
              result.textContent = "Winner: " + SEGMENTS[target];
            }
          }

          window.requestAnimationFrame(step);
        }

        draw(rotation);
        spinButton.addEventListener("click", spin);
      })();
    </script>
  </body>
</html>
