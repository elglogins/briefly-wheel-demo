<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Wheel</title>
    <style>
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 4rem 1rem;
        text-align: center;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
      }
      .hero button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 1px solid #666;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
      }
      #back-to-top {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid #666;
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #back-to-top.is-visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <h1 id="greeting">Hello world</h1>
      <button id="lang-toggle" type="button">Latviski</button>
    </main>
    <footer style="text-align: center; font-size: 0.85rem; color: #666; padding: 1rem;">
      &copy; 2026 Elgars Logins &middot;
      <a href="https://github.com/elglogins/briefly-wheel-demo" target="_blank" rel="noopener noreferrer">View on GitHub</a>
      <br>
      Made with &#10084; in Aarhus, Denmark
    </footer>
    <button id="back-to-top" type="button" aria-label="Back to top" aria-hidden="true" tabindex="-1">&uarr;</button>
    <script>
      (function () {
        var GREETINGS = { en: "Hello world", lv: "Sveiks!", da: "Hej verden" };
        var TOGGLE_LABEL = { en: "Latviski", lv: "Dansk", da: "English" };
        var LANG_ORDER = ["en", "lv", "da"];
        var STORAGE_KEY = "wheel.lang";
        var greeting = document.getElementById("greeting");
        var toggle = document.getElementById("lang-toggle");

        function apply(lang) {
          if (!GREETINGS[lang]) lang = "en";
          document.documentElement.lang = lang;
          greeting.textContent = GREETINGS[lang];
          toggle.textContent = TOGGLE_LABEL[lang];
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
        }

        var initial = "en";
        try { initial = localStorage.getItem(STORAGE_KEY) || "en"; } catch (e) {}
        apply(initial);

        toggle.addEventListener("click", function () {
          var current = LANG_ORDER.indexOf(document.documentElement.lang);
          var next = LANG_ORDER[(current + 1) % LANG_ORDER.length];
          apply(next);
        });

        var backToTop = document.getElementById("back-to-top");
        var ticking = false;
        var visible = false;

        function updateVisibility() {
          var shouldShow = window.scrollY > 200;
          if (shouldShow !== visible) {
            visible = shouldShow;
            backToTop.classList.toggle("is-visible", visible);
            if (visible) {
              backToTop.removeAttribute("aria-hidden");
              backToTop.removeAttribute("tabindex");
            } else {
              backToTop.setAttribute("aria-hidden", "true");
              backToTop.setAttribute("tabindex", "-1");
            }
          }
          ticking = false;
        }

        window.addEventListener("scroll", function () {
          if (!ticking) {
            window.requestAnimationFrame(updateVisibility);
            ticking = true;
          }
        });

        backToTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();
    </script>
  </body>
</html>
