name: ci

# Minimal Checks-API workflow so Briefly's M3 `check_suite.completed`
# webhook trigger can fire. CodeRabbit + the legacy commit-status API
# don't produce check_suite events; a GitHub Actions workflow does.
#
# Builds the Vite + React app (ADR-05062026.1) so CI actually validates the
# rewrite compiles, instead of asserting a hand-written index.html.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
